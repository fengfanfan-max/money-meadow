<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EC" />
    <meta
      name="description"
      content="Money Meadow — three playful mini-games that teach children how money works. No accounts, no ads, no trackers."
    />
    <!--
      Referrer and feature policy are deliberately tight. This app has no backend,
      so anything it cannot reach is one less thing to explain in a COPPA review.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <title>Money Meadow — money skills mini-games for kids</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        Money Meadow needs JavaScript to run its games. Nothing is tracked either way.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
